<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0d1f">
<title>Vüsal &amp; Aziza</title>
<meta property="og:title" content="Vüsal &amp; Aziza · 27 noyabr 2026">
<meta property="og:description" content="Sizi toyumuza dəvət edirik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/curtain.webp">
<link rel="preload" as="image" href="assets/corner-top.webp">
<link rel="preload" as="image" href="assets/corner-bottom.webp">
<link rel="preload" as="image" href="assets/scene.webp">
<link rel="stylesheet" href="style.css?v=1"><!-- bump ?v= on every change so phones skip their cached copy -->

<script>
// ===== EDIT ONLY THIS BLOCK =====
const CONFIG = {
  bride: 'Aziza',
  groom: 'Vüsal',
  date: '2026-11-27T18:00:00+04:00',   // ISO, with your timezone offset
  timeZone: 'Asia/Baku',
  greeting: 'İki ürək, bir əhd. Əbədiyyətimizin başladığı bu xoşbəxt günü bizimlə birlikdə qeyd etməyə sizi böyük sevinclə dəvət edirik.',
  events: [
    { title: 'Toy mərasimi', time: '18:00', place: 'Məkan adı', address: 'Bakı, Azərbaycan' },   // TODO: real time + venue
  ],
  mapQuery: 'Baku',                    // TODO: venue name, Baku  // what you'd type into Google Maps (not shown to guests)
  closing: 'Sizin iştirakınız bizim üçün ən gözəl hədiyyədir. Bu xoşbəxt günü sizinlə birlikdə qeyd etməyi səbirsizliklə gözləyirik.',
  music: 'assets/music.mp3',            // '' for no music
};
</script>
</head>
<body class="locked">

<!-- The scene: fixed behind the whole page -->
<div class="scene" aria-hidden="true">
  <img class="scene-bg" src="assets/scene.webp" alt="Axşam çağı şamlarla işıqlanan, pionlarla bəzədilmiş mərmər köşk">
</div>

<!-- Floral arch the camera flies through as the curtains open -->
<img class="floral-gate" id="floralGate" src="assets/floral-gate.webp" alt="" aria-hidden="true">

<!-- ===== Cover: curtains ===== -->
<div class="gate" id="gate">
  <img class="curtain curtain-l" src="assets/curtain.webp" alt="">
  <img class="curtain curtain-r" src="assets/curtain.webp" alt="">
  <img class="corner corner-top" src="assets/corner-top.webp" alt="">
  <img class="corner corner-bottom" src="assets/corner-bottom.webp" alt="">

  <div class="cover">
    <p class="cover-names"><span data-c="groom"></span><span class="amp">&amp;</span><span data-c="bride"></span></p>
    <p class="cover-date" data-c="dateDots"></p>
    <p class="cover-to">Əziz <strong id="guest">Qonaq</strong>sizi toyumuza dəvət edirik</p>
    <button class="btn light" id="open">Dəvətnaməni aç</button>
  </div>
</div>

<div class="petals" aria-hidden="true"></div>

<main>
  <!-- Hero: the scene itself, names in the sky -->
  <section class="hero">
    <img class="hero-swag" src="assets/swag-florals.webp" alt="">
    <div class="hero-text">
      <p class="kicker">Toy mərasimi</p>
      <h1 class="names">
        <span class="n1" data-c="groom"></span>
        <span class="amp">&amp;</span>
        <span class="n2" data-c="bride"></span>
      </h1>
      <p class="hero-date"><span data-c="dateLong"></span><span class="hero-venue" data-c="venueShort"></span></p>
    </div>
    <img class="hero-fg" src="assets/foreground-flowers.webp" alt="">
    <span class="scroll-line" aria-hidden="true"></span>
  </section>

  <div class="paper">
    <!-- Greeting -->
    <section class="greeting">
      <img class="spray" src="assets/florals-spray.webp" alt="" loading="lazy">
      <p class="verse" id="verse" data-c="greeting"></p>
    </section>

    <!-- Date -->
    <section class="date">
      <h2 class="title">Tarixi yadda saxlayın</h2>
      <div class="cal">
        <p class="cal-head" data-c="monthYear"></p>
        <div class="cal-grid" id="cal"></div>
      </div>
      <div class="timer" id="timer" aria-live="off">
        <div><b id="d">0</b><span>gün</span></div>
        <div><b id="h">00</b><span>saat</span></div>
        <div><b id="m">00</b><span>dəqiqə</span></div>
        <div><b id="s">00</b><span>saniyə</span></div>
      </div>
    </section>

    <!-- Venue -->
    <section class="venue">
      <h2 class="title">Nə vaxt və harada</h2>
      <p class="v-day" data-c="dateLong"></p>
      <div id="events"></div>
      <div class="map"><iframe id="map" title="Məkanın xəritəsi" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <a class="btn" id="directions" target="_blank" rel="noopener">Marşrutu göstər</a>
    </section>
  </div>

  <!-- Closing: back out into the scene -->
  <section class="closing">
    <div class="wreath closing-wreath">
      <img src="assets/wreath.webp" alt="" loading="lazy">
      <div class="wreath-text">
        <p class="thanks">Təşəkkürlər</p>
        <p class="sig" data-c="couple"></p>
      </div>
    </div>
    <p class="closing-note" data-c="closing"></p>
    <img class="closing-fg" src="assets/foreground-flowers.webp" alt="" loading="lazy">
  </section>
  <footer><span data-c="initials"></span> · <span data-c="dateDots"></span></footer>
</main>

<button class="music" id="music" aria-label="Musiqini dayandır" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Zm11-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z"/></svg>
</button>
<audio id="audio" loop preload="none"></audio>

<script src="script.js?v=1"></script>
</body>
</html>
